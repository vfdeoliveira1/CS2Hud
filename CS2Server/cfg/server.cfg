// ===== CS2Server: configuração base (copiada pra game/csgo/cfg/server.cfg) =====
hostname "Meu Campeonato | 5x5"
sv_password "senha-dos-jogadores"     // senha pra entrar (jogadores e você/observador)
rcon_password "troque-esta-senha"     // senha do console remoto (só sua)

// partida competitiva 5x5 (o MatchZy aplica o resto ao começar: MR12, prorrogação etc.)
mp_autoteambalance 0
mp_limitteams 0
bot_quota 0
bot_kick
sv_allow_votes 0
mp_spectators_max 4

// 128 de upload de dados pros jogadores (fluidez); ajuste se a internet for fraca
sv_maxrate 0
sv_minrate 196608

// GOTV desligado (você espectra direto no servidor; o atraso anti-ghost fica no OBS)
tv_enable 0

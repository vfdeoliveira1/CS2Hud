<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>CS2 HUD 5x5 — tempo real</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:      rgba(9,13,18,.90);
    --bg-soft: rgba(9,13,18,.72);
    --ct:      #6E9EDA;
    --tr:      #D9A441;
    --bone:    #EDEFF2;
    --steel:   #78848F;
    --line:    rgba(237,239,242,.13);
    --good:    #6FCF97;
    --warn:    #E0C94B;
    --bad:     #E0645A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:transparent;overflow:hidden;
    font-family:'Barlow Condensed',sans-serif;color:var(--bone);-webkit-font-smoothing:antialiased}
  #stage{position:absolute;top:0;left:0;width:1920px;height:1080px;transform-origin:top left}
  img.ic{display:block;filter:brightness(0) invert(1)}

  /* ---------------- placar central ---------------- */
  .spine{position:absolute;top:0;left:50%;transform:translateX(-50%);
         width:640px;display:flex;flex-direction:column;align-items:center}
  .spine-main{width:100%;height:88px;background:var(--bg);backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
    display:grid;grid-template-columns:1fr 220px 1fr;align-items:center;
    clip-path:polygon(0 0,100% 0,100% calc(100% - 28px),calc(100% - 28px) 100%,28px 100%,0 calc(100% - 28px))}
  .side{display:flex;align-items:center;gap:10px;padding:0 20px}
  .side.right{flex-direction:row-reverse}
  .tag{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;
       letter-spacing:.14em;padding:4px 8px 3px;border:1px solid currentColor;line-height:1}
  .tag.ct{color:var(--ct)} .tag.tr{color:var(--tr)}
  /* logo do time no lugar do "CT"/"TR" */
  .tag.logo{border:none;padding:0;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
  .tag.logo img{max-width:100%;max-height:100%;object-fit:contain}

  /* quadrados da série (MD3, MD5...): um por mapa necessário pra vencer,
     empilhados ao lado do placar; preenchido = mapa vencido */
  .series{display:flex;flex-direction:column;gap:3px;margin-left:auto}
  .side.right .series{margin-left:0;margin-right:auto}
  .series:empty{display:none}
  .series i{display:block;width:14px;height:8px;background:rgba(237,239,242,.14);box-shadow:inset 0 0 0 1px rgba(237,239,242,.18)}
  .series.ct i.won{background:var(--ct);box-shadow:none}
  .series.tr i.won{background:var(--tr);box-shadow:none}

  /* ---------------- popup de vencedor do round ---------------- */
  .roundWin{position:absolute;top:150px;left:50%;transform:translate(-50%,-12px);
    display:flex;align-items:center;gap:16px;padding:14px 34px 14px 22px;min-width:420px;
    color:#0b0f14;opacity:0;pointer-events:none;transition:opacity .3s ease,transform .3s ease;
    clip-path:polygon(0 0,100% 0,calc(100% - 18px) 100%,18px 100%);box-shadow:0 8px 30px rgba(0,0,0,.45)}
  .roundWin.show{opacity:1;transform:translate(-50%,0)}
  .roundWin.ct{background:var(--ct)} .roundWin.tr{background:var(--tr)}
  .roundWin .rwLogo{width:56px;height:56px;object-fit:contain;display:none}
  .roundWin .rwText{display:flex;flex-direction:column;align-items:flex-start;line-height:1}
  .roundWin .rwName{font-family:'Anton',sans-serif;font-size:40px;letter-spacing:.03em;text-transform:uppercase}
  .roundWin .rwSub{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;letter-spacing:.22em;
    text-transform:uppercase;margin-top:6px;opacity:.8}
  .lbl{font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
  .midCol{display:flex;align-items:center;justify-content:center;width:100%;height:100%;position:relative}
  .scoreCol{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .roundLbl{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;
      letter-spacing:.22em;color:var(--steel);text-transform:uppercase;line-height:1}
  .score{display:flex;align-items:baseline;justify-content:center;gap:14px;
         font-family:'Anton',sans-serif;font-size:56px;line-height:1}
  .score .sep{font-size:22px;color:var(--steel);transform:translateY(-4px);
      font-family:'JetBrains Mono',monospace;letter-spacing:.02em}
  /* barras da bomba: ficam logo abaixo do placar (que continua visível).
     Vermelha = tempo até explodir; azul = progresso do defuse. */
  .bombBars{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);width:170px;
      display:none;flex-direction:column;gap:3px}
  .bombBar{width:100%;height:5px;background:rgba(255,255,255,.15);position:relative;overflow:hidden}
  .bombBar i{position:absolute;top:0;left:0;bottom:0;width:0%;transition:width .25s linear}
  #bombBarFill{background:var(--bad)}
  #defuseBarFill{background:var(--ct)}
  #defuseBar{display:none}
  .spine-main.bomb-planted .bombBars{display:flex}
  .spine-main.bomb-planted .scoreCol{transform:translateY(-5px)}
  .spine-main.defusing #defuseBar{display:block}
  .spine-main.defusing .scoreCol{transform:translateY(-8px)}
  .score .lead{color:#fff} .score .trail{color:var(--steel)}
  .ribbon{display:flex;gap:3px;margin-top:7px;height:8px}
  .ribbon u{width:10px;display:block;text-decoration:none}
  .ribbon u.unk{background:rgba(237,239,242,.18)} /* round jogado com a HUD fechada: vencedor desconhecido */
  .ribbon .half{width:2px;height:14px;margin:-3px 5px 0;background:var(--bone)} /* troca de lado */
  #connWarn{position:absolute;top:96px;left:50%;transform:translateX(-50%);
    background:rgba(224,100,90,.15);border:1px solid var(--bad);color:#F5B5AF;
    font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.05em;
    padding:7px 14px;display:none;white-space:nowrap}

  /* ---------------- colunas de jogadores ---------------- */
  /* top calculado pra caber 5 cards (92px + 8px de gap cada) até quase
     o rodapé de uma tela 1920x1080: 5*92 + 4*8 = 492px de altura total. */
  .roster{position:absolute;top:560px;width:460px;display:flex;flex-direction:column;gap:8px}
  .roster.left{left:24px} .roster.right{right:24px}
  /* card: [bloco de vida] [linha 1: nº + nick + kills do round ... arma]
                            [linha 2: K/A/D + $ ... granadas, kit, colete]
     + barra de vida fina na base. O lado direito da tela é espelhado. */
  .card{position:relative;height:92px;display:grid;grid-template-columns:70px 1fr;
        background:var(--bg-soft);backdrop-filter:blur(5px);overflow:hidden;transition:opacity .2s;
        --team:var(--steel);--team-soft:rgba(120,132,143,.16)}
  .card.ct{--team:var(--ct);--team-soft:rgba(110,158,218,.16)}
  .card.tr{--team:var(--tr);--team-soft:rgba(217,164,65,.16)}
  .card.dead{opacity:.38}
  .card.empty{opacity:.25}
  .hpBox{display:flex;align-items:center;justify-content:center;background:var(--team-soft);
        border-left:4px solid var(--team);
        font-family:'JetBrains Mono',monospace;font-weight:700;font-size:26px}
  .hpBox.good{color:var(--good)} .hpBox.warn{color:var(--warn)} .hpBox.bad{color:var(--bad)}
  .card.dead .hpBox{color:var(--steel)}
  .cMain{display:flex;flex-direction:column;justify-content:center;gap:9px;padding:0 16px;min-width:0}
  .cRow{display:flex;align-items:center;gap:10px;min-width:0}
  .badge{flex:none;width:20px;height:20px;border-radius:50%;background:var(--team);color:#0b0f14;
        display:flex;align-items:center;justify-content:center;
        font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;line-height:1}
  .nick{font-size:26px;font-weight:700;text-transform:uppercase;line-height:1;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  /* abates neste round: losangos vermelhos ao lado do nick */
  .killPips{display:flex;gap:3px;flex:none}
  .killPips i{width:9px;height:9px;background:var(--bad);
    clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);display:block}
  .weaponIc{margin-left:auto;flex:none;height:26px;width:90px;object-fit:contain;object-position:right center}
  .stats{display:flex;align-items:center;gap:10px;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--steel);flex:none}
  .stats b{font-weight:700;color:var(--bone)}
  .stats .money{color:var(--good);font-weight:700}
  .gear{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}
  .gear img.ic{width:18px;height:18px;object-fit:contain;opacity:.9}
  .gear .sep{width:1px;height:14px;background:var(--line)}
  .hpBar{position:absolute;left:0;bottom:0;height:3px;background:var(--team);transition:width .3s}

  /* espelhado no lado direito da tela */
  .roster.right .card{grid-template-columns:1fr 70px}
  .roster.right .hpBox{order:2;border-left:none;border-right:4px solid var(--team)}
  .roster.right .cMain{order:1}
  .roster.right .cRow{flex-direction:row-reverse}
  .roster.right .weaponIc{margin-left:0;margin-right:auto;object-position:left center;transform:scaleX(-1)}
  .roster.right .gear{margin-left:0;margin-right:auto;flex-direction:row-reverse}
  .roster.right .hpBar{left:auto;right:0}

  /* ---------------- radar ---------------- */
  .mapTitle{position:absolute;top:24px;left:24px;width:340px;height:36px;
    background:var(--bg);border:1px solid var(--line);border-bottom:none;
    display:flex;align-items:center;justify-content:center;
    font-family:'Anton',sans-serif;font-size:24px;letter-spacing:.12em;color:#fff;
    text-transform:uppercase;line-height:1}
  .radarBox{position:absolute;top:60px;left:24px;
    width:340px;height:340px;background:var(--bg-soft);backdrop-filter:blur(5px);
    border:1px solid var(--line);overflow:hidden}
  .radarBox .mapImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
  .radarBox .grid{position:absolute;inset:0;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:23px 23px}
  .radarBox .label{position:absolute;top:-19px;left:0;font-family:'JetBrains Mono',monospace;
    font-size:10px;letter-spacing:.2em;color:var(--steel);text-transform:uppercase}
  .radarBox .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    text-align:center;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--steel);
    padding:14px;line-height:1.5}
  .dot{position:absolute;width:17px;height:17px;border-radius:50%;transform:translate(-50%,-50%);
    border:1px solid rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;color:#0b0f14;line-height:1}
  .dot.ct{background:var(--ct)} .dot.tr{background:var(--tr)}
  .dot .dotIcon{display:none;width:65%;height:65%;object-fit:contain;
    filter:brightness(0) invert(1);pointer-events:none}

  /* marcador de morto: some o círculo preenchido, vira um "X" translúcido
     na cor do time, no último lugar conhecido onde o jogador morreu. */
  .dot.dead{background:transparent;border:none;box-shadow:none;opacity:.85}
  .dot.dead .dotIcon{display:none}
  .dot.dead .dotNum{font-size:15px;font-weight:900;font-family:Arial,sans-serif}
  .dot.dead.ct .dotNum{color:var(--ct)}
  .dot.dead.tr .dotNum{color:var(--tr)}

  /* jogador com a bomba na mão: o próprio ponto dele fica vermelho, mas
      continua mostrando o número. */
  .dot.bombCarrier{background:#E0201B;border-color:#fff;color:#fff}
    .dot.bombCarrier .dotIcon{display:none}

  /* marcador da bomba largada/plantada: SEM círculo de fundo, só o ícone
     puro (tingido de vermelho). Estático enquanto largada; pisca quando
     plantada (ou sendo desarmada) pra chamar atenção pro local exato. */
  .dot.bomb{background:transparent;border:none;box-shadow:none;width:26px;height:26px}
  .dot.bomb .dotNum{display:none}
  .dot.bomb .dotIcon{display:block;width:100%;height:100%;
    /* aproximação de tingimento vermelho via filtro CSS (não depende de
       cor interna do svg); ajuste os valores se a cor não bater exato */
    /* brightness(0) zera a cor original; o resto pinta de vermelho puro
       (~#E0201B, mesmo tom do ponto de quem carrega a bomba) */
    filter:brightness(0) saturate(100%) invert(16%) sepia(99%) saturate(7404%) hue-rotate(4deg) brightness(95%) contrast(118%)
      drop-shadow(0 0 1px rgba(0,0,0,.9))}
  .dot.bomb.planted{width:30px;height:30px;animation:bombBlink .6s steps(1,end) infinite}
  @keyframes bombBlink{
    0%,49%{opacity:1}
    50%,100%{opacity:.15}
  }

  /* ---------------- utilitários no radar ---------------- */
  /* camada das trajetórias (SVG em coordenadas 0-100 do radar) e dos
     ícones de fumaça/fogo. Fica abaixo dos pontos dos jogadores. */
  .utilLayer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .utilLayer polyline{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;
    vector-effect:non-scaling-stroke}
  .utilLayer circle.head{vector-effect:non-scaling-stroke}
  .util{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;
    border-radius:50%;pointer-events:none}
  .util img,.util svg{width:62%;height:62%;object-fit:contain}
  /* fumaça: círculo cinza do tamanho aproximado da fumaça + ícone de nuvem */
  .util.smoke{background:rgba(205,211,217,.55);border:1px solid rgba(255,255,255,.75)}
  .util.smoke svg{fill:#fff;filter:drop-shadow(0 0 1px rgba(0,0,0,.8))}
  /* fogo: círculo laranja translúcido cobrindo os focos + ícone de fogo */
  .util.fire{background:rgba(255,110,30,.35);border:1px solid rgba(255,150,60,.9)}
  .util.fire img{filter:brightness(0) saturate(100%) invert(62%) sepia(83%) saturate(2270%) hue-rotate(349deg) brightness(101%) contrast(101%)
    drop-shadow(0 0 1px rgba(0,0,0,.9))}

  /* ---------------- painel "espectando agora" ---------------- */
  /* ---------------- tela de pausa / timeout ---------------- */
  /* aparece no lugar dos cards (e do painel "espectando") durante pausa
     técnica, timeout, ou quando forçada no control.html */
  .pause{position:absolute;left:24px;right:24px;bottom:24px;display:none;flex-direction:column;gap:6px}
  #stage.paused .pause{display:flex}
  #stage.paused .roster, #stage.paused .specPanel{display:none !important}
  .pHead,.pBody{display:grid;grid-template-columns:700px 1fr 700px;gap:6px}
  .pBox{background:var(--bg);border:1px solid var(--line);backdrop-filter:blur(6px)}
  .pStats{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;height:62px;padding:0 10px;
    border-top:3px solid var(--team)}
  .pStats.ct{--team:var(--ct)} .pStats.tr{--team:var(--tr)}
  .pStat{display:flex;flex-direction:column;align-items:center;gap:5px;line-height:1}
  .pStat .k{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.16em;color:var(--steel);text-transform:uppercase}
  .pStat .v{font-family:'Anton',sans-serif;font-size:24px;letter-spacing:.03em;color:var(--good)}
  .pTimeouts{display:flex;gap:4px;height:24px;align-items:center}
  .pTimeouts i{width:18px;height:6px;background:rgba(237,239,242,.15)}
  .pTimeouts i.on{background:var(--team)}
  .pCenter{display:flex;align-items:center;justify-content:center;gap:14px;height:62px;padding:0 14px}
  .pCenter img{width:40px;height:40px;object-fit:contain}
  .pCenter .tn{font-size:24px;font-weight:700;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
  .pCenter .sc{font-family:'Anton',sans-serif;font-size:38px;line-height:1}
  .pCenter .vs{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--steel)}
  .pCenter .ctc{color:var(--ct)} .pCenter .trc{color:var(--tr)}
  .pTable{display:flex;flex-direction:column;gap:4px}
  .pRow{display:grid;grid-template-columns:170px 56px 1fr 150px 86px;align-items:center;gap:10px;height:40px;
    padding:0 12px;background:var(--bg);border-left:4px solid var(--team)}
  .pTable.ct{--team:var(--ct)} .pTable.tr{--team:var(--tr)}
  .pTable.tr .pRow{grid-template-columns:86px 150px 1fr 56px 170px;border-left:none;border-right:4px solid var(--team)}
  /* espelha a ordem das colunas: $ | armas | granadas | colete/kit | nick */
  .pTable.tr .pRow > :nth-child(1){order:5} .pTable.tr .pRow > :nth-child(2){order:4}
  .pTable.tr .pRow > :nth-child(3){order:3} .pTable.tr .pRow > :nth-child(4){order:2}
  .pTable.tr .pRow > :nth-child(5){order:1}
  .pRow.dead{opacity:.45}
  .pRow .pn{font-size:20px;font-weight:700;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pTable.tr .pn{text-align:right}
  .pRow .pIcons{display:flex;gap:5px;align-items:center}
  .pTable.tr .pIcons{justify-content:flex-end}
  .pRow .pIcons img.ic{height:18px;width:auto;max-width:22px;object-fit:contain;opacity:.9}
  .pRow .pGuns{display:flex;gap:10px;align-items:center;justify-content:flex-end}
  .pTable.tr .pGuns{justify-content:flex-start}
  .pRow .pGuns img.ic{height:20px;width:auto;max-width:86px;object-fit:contain}
  .pTable.tr .pGuns img.ic{transform:scaleX(-1)}
  .pRow .pm{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;color:var(--good);text-align:right}
  .pTable.tr .pm{text-align:left}
  .pMid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
  .pMid .t1{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;letter-spacing:.3em;color:var(--steel)}
  .pMid .t2{display:flex;align-items:center;gap:10px;font-family:'Anton',sans-serif;font-size:36px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
  .pMid .t2 img{width:36px;height:36px;object-fit:contain}
  .pMid .t2.ct{color:var(--ct)} .pMid .t2.tr{color:var(--tr)}
  .pMid .t3{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;letter-spacing:.18em;color:var(--bone)}
  .pMid .clock{font-family:'Anton',sans-serif;font-size:54px;line-height:1;color:#fff}
  .pCoachRow{display:grid;grid-template-columns:700px 1fr 700px;gap:6px}
  .pCoach{display:flex;align-items:center;gap:8px;height:30px}
  .pCoach.tr{justify-content:flex-end}
  .pCoach .ck{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.16em;
    padding:4px 7px;background:var(--team);color:#0b0f14}
  .pCoach.ct{--team:var(--ct)} .pCoach.tr{--team:var(--tr)}
  .pCoach .cn{font-size:20px;font-weight:700;text-transform:uppercase;padding:2px 10px;background:var(--bg)}
  .pCoach:empty{visibility:hidden}

  /* ---------------- mira no centro da tela ---------------- */
  /* 4 traços verdes com um vão no meio, centralizados exatamente no
     meio do palco 1920x1080. */
  .crosshair{position:absolute;left:960px;top:540px;width:0;height:0;display:none;pointer-events:none}
  .crosshair.show{display:block}
  .crosshair i{position:absolute;background:#0A9A0A;border-radius:1px;box-shadow:0 0 1px rgba(0,0,0,.6)}
  .crosshair i.t,.crosshair i.b{width:2px;height:6px;left:-1px}
  .crosshair i.l,.crosshair i.r{width:6px;height:2px;top:-1px}
  .crosshair i.t{top:-9px} .crosshair i.b{top:3px}
  .crosshair i.l{left:-9px} .crosshair i.r{left:3px}
  #stage.paused .crosshair{display:none}

  .specPanel{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);
    display:none;align-items:center;gap:16px;background:var(--bg-soft);backdrop-filter:blur(5px);
    border:1px solid var(--line);border-left:4px solid var(--steel);padding:12px 22px;min-width:380px}
  .specPanel.ct{border-left-color:var(--ct)} .specPanel.tr{border-left-color:var(--tr)}
  .specPanel .specLabel{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.22em;
    color:var(--steel);text-transform:uppercase;position:absolute;top:-18px;left:0}
  .specPanel img.weaponIc{width:52px;height:30px;object-fit:contain}
  .specPanel .specWeaponCol{display:flex;flex-direction:column;align-items:center;gap:4px}
  .specPanel .specAmmo{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--steel);white-space:nowrap}
  .specPanel .specAmmo b{color:var(--bone);font-weight:700}
  .specPanel .specAmmo .reserve{color:var(--good)}
  .specPanel .specInfo{display:flex;flex-direction:column;gap:3px}
  .specPanel .specNick{font-size:28px;font-weight:700;text-transform:uppercase;line-height:1}
  .specPanel .specStats{display:flex;gap:14px;font-family:'JetBrains Mono',monospace;
    font-size:13px;color:var(--steel);align-items:center}
  .specPanel .specStats .money{color:var(--good)}
  .specPanel .specHp{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:32px;
    margin-left:auto}
  .specPanel .specHp.good{color:var(--good)} .specPanel .specHp.warn{color:var(--warn)} .specPanel .specHp.bad{color:var(--bad)}

  /* ---------------- pips de kill no round ---------------- */
  .killPips{display:flex;gap:3px;margin-top:4px}
  .killPips i{width:8px;height:8px;background:var(--bad);
    clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);display:block}
</style>
</head>
<body>
<div id="stage">

  <div class="spine">
    <div class="spine-main">
      <div class="side left"><span class="tag ct" id="ctTag">CT</span><span class="lbl" id="ctLabel">COUNTER</span><div class="series ct" id="ctSeries"></div></div>
      <div class="midCol">
        <div class="scoreCol">
          <div class="roundLbl" id="roundInfo">ROUND —</div>
          <div class="score" id="scoreRow">
            <span id="scoreCT">0</span>
            <span class="sep" id="scoreSep">:</span>
            <span id="scoreT">0</span>
          </div>
        </div>
        <div class="bombBars">
          <div class="bombBar"><i id="bombBarFill"></i></div>
          <div class="bombBar" id="defuseBar"><i id="defuseBarFill"></i></div>
        </div>
      </div>
      <div class="side right"><span class="tag tr" id="trTag">TR</span><span class="lbl" id="trLabel">TERRORIST</span><div class="series tr" id="trSeries"></div></div>
    </div>
    <div class="ribbon" id="ribbon"></div>
  </div>

  <div class="roundWin" id="roundWin">
    <img class="rwLogo" id="rwLogo" alt="">
    <div class="rwText"><span class="rwName" id="rwName">—</span><span class="rwSub" id="rwSub">venceu o round</span></div>
  </div>

  <div id="connWarn">Sem conexão com http://localhost:5000/api/hud — o CS2HudExporter está rodando?</div>

  <div class="roster left" id="rosterCT"></div>
  <div class="roster right" id="rosterT"></div>

  <div class="mapTitle" id="mapName">—</div>
  <div class="radarBox" id="radarBox">
    <img class="mapImg" id="radarMapImg" alt="">
    <div class="grid" id="radarGrid"></div>
    <svg class="utilLayer" id="utilTrails" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
    <div class="utilLayer" id="utilIcons"></div>
    <div class="hint" id="radarHint">Posições só chegam quando você está<br>espectando a partida (allplayers_position)</div>
  </div>
  <div class="pause" id="pauseScreen">
    <div class="pCoachRow"><div class="pCoach ct" id="pCoachCT"></div><div></div><div class="pCoach tr" id="pCoachT"></div></div>
    <div class="pHead">
      <div class="pBox pStats ct" id="pStatsCT"></div>
      <div class="pBox pCenter" id="pCenter"></div>
      <div class="pBox pStats tr" id="pStatsT"></div>
    </div>
    <div class="pBody">
      <div class="pTable ct" id="pTableCT"></div>
      <div class="pBox pMid" id="pMid"></div>
      <div class="pTable tr" id="pTableT"></div>
    </div>
  </div>

  <div class="crosshair" id="crosshair"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i></div>

  <div class="specPanel" id="specPanel">
    <span class="specLabel">Espectando</span>
    <div class="specWeaponCol">
      <img class="weaponIc ic" id="specWeapon" src="" alt="">
      <span class="specAmmo" id="specAmmo"></span>
    </div>
    <div class="specInfo">
      <span class="specNick" id="specNick">—</span>
      <div class="specStats">
        <span id="specTeam">CT</span>
        <span>K <b id="specKills" style="color:var(--bone)">0</b></span>
        <span>D <b id="specDeaths" style="color:var(--bone)">0</b></span>
        <span class="money" id="specMoney">$0</span>
      </div>
    </div>
    <span class="specHp" id="specHp">100</span>
  </div>

</div>

<script>
(function(){
  'use strict';

  // =====================================================================
  // CONFIGURAÇÃO
  // =====================================================================
  var API_BASE = 'http://localhost:5000';
  var API_URL = API_BASE + '/api/hud';
  var ROUND_WIN_POPUP_MS = 4000; // quanto tempo o popup de vencedor do round fica na tela
  var POLL_MS = 33; // ~30x/s: pega cada pacote novo do CS2 logo que chega (a fluidez em si vem do requestAnimationFrame do radar)
  var SAME_STATE_RENDER_MS = 200; // se o JSON não mudou, re-renderiza no máximo a cada 200ms (só pros timers estimados andarem)
  var ICONS_PATH = './icons/';
  var MAPS_PATH = './icons/maps/'; // imagens de radar dos mapas (você fornece)
  // Tempo padrão da bomba em partidas competitivas de CS2. Se você jogar
  // em servidor com mp_c4timer diferente, ajuste aqui.
  var BOMB_TOTAL_SECONDS = 40;
  // Duração padrão de freezetime e do round "live" (mp_freezetime /
  // mp_round_time_defuse). Usados só como estimativa local quando o
  // servidor não manda o tempo exato (o que só acontece espectando -
  // veja README). Ajuste se seu servidor usa configs diferentes.
  var FREEZETIME_SECONDS = 15;
  var ROUND_TIME_SECONDS = 115;

  // Mapeia o nome interno do GSI ("weapon_ak47", "weapon_c4"...) pro nome
  // do arquivo .svg. A maioria é 1:1 (só tira o prefixo "weapon_"), estes
  // são os casos que precisam de um empurrãozinho.
  var WEAPON_OVERRIDES = {
    weapon_hkp2000: 'hkp2000', weapon_usp_silencer: 'usp_silencer',
    weapon_m4a1_silencer: 'm4a1_silencer', weapon_m4a1: 'm4a1',
    weapon_knife: 'knife', weapon_bayonet: 'bayonet'
  };

  // Calibração de radar (fonte: arquivos de overview do próprio jogo —
  // "pos_x"/"pos_y"/"scale" — valores aproximados da comunidade; ajuste
  // fino pode ser necessário mapa a mapa).
  var RADAR_CAL = {
    de_dust2:    { x: -2476, y: 3239, scale: 4.4 },
    de_mirage:   { x: -3230, y: 1713, scale: 5.0 },
    de_inferno:  { x: -2087, y: 3870, scale: 4.9 },
    de_nuke:     { x: -3453, y: 2887, scale: 7.0 },
    de_overpass: { x: -4831, y: 1781, scale: 5.2 },
    de_vertigo:  { x: -3168, y: 1762, scale: 4.0 },
    de_ancient:  { x: -2953, y: 2164, scale: 5.0 },
    de_anubis:   { x: -2796, y: 3328, scale: 5.22 },
    de_train:    { x: -2477, y: 2392, scale: 4.7 }
  };

  // =====================================================================
  // HELPERS
  // =====================================================================
  var $ = function(id){ return document.getElementById(id); };

  function weaponIcon(rawName){
    if(!rawName) return null;
    if(WEAPON_OVERRIDES[rawName]) return ICONS_PATH + WEAPON_OVERRIDES[rawName] + '.svg';
    var stripped = rawName.replace(/^weapon_/, '');
    return ICONS_PATH + stripped + '.svg';
  }

  function onIconError(img){
    // se o svg específico não existir na pasta (ex: variação de faca/skin
    // que você não baixou), cai pro genérico em vez de ficar quebrado.
    if(img.dataset.fallback) { img.style.visibility = 'hidden'; return; }
    img.dataset.fallback = '1';
    img.src = ICONS_PATH + 'knife.svg'; // genérico que existe na pasta icons/
  }

  function makeIcon(src, cls){
    var img = document.createElement('img');
    img.className = 'ic ' + (cls || '');
    img.src = src;
    img.onerror = function(){ onIconError(img); };
    return img;
  }

  function hpClass(hp){
    if(hp <= 0) return 'bad';
    if(hp <= 30) return 'bad';
    if(hp <= 65) return 'warn';
    return 'good';
  }

  function fmtClock(totalSeconds){
    var s = Math.max(0, Math.round(totalSeconds));
    var m = Math.floor(s / 60);
    var r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }

  // =====================================================================
  // RENDER DE UM CARD DE JOGADOR
  // =====================================================================
  // globalIndex: número fixo de 0 a 9 (CT = 0-4, T = 5-9), mostrado no
  // card E no radar, pra identificar visualmente o mesmo jogador nos dois.
  function renderCard(container, player, globalIndex, side){
    var card = document.createElement('div');

    if(!player){
      card.className = 'card empty ' + side;
      card.innerHTML = '<div class="hpBox"></div><div class="cMain"><div class="cRow">' +
        '<span class="badge">' + globalIndex + '</span><span class="nick">— vazio —</span></div></div>';
      container.appendChild(card);
      return;
    }

    var dead = !!player.isDead;
    card.className = 'card ' + side + (dead ? ' dead' : '');

    // bloco de vida
    var hpBox = document.createElement('div');
    hpBox.className = 'hpBox ' + hpClass(player.health);
    hpBox.textContent = dead ? '✕' : player.health;
    card.appendChild(hpBox);

    var main = document.createElement('div'); main.className = 'cMain';

    // linha 1: nº (mesma cor/número do ponto no radar) + nick + abates do
    // round + arma "de verdade" (se estiver com granada na mão, continua
    // mostrando a arma - ver displayWeapon em render())
    var row1 = document.createElement('div'); row1.className = 'cRow';
    var badge = document.createElement('span'); badge.className = 'badge'; badge.textContent = globalIndex;
    var nick = document.createElement('span'); nick.className = 'nick'; nick.textContent = player.nick || '?';
    row1.appendChild(badge); row1.appendChild(nick);
    var rk = player.roundKills || 0;
    if(rk > 0){
      var pips = document.createElement('span'); pips.className = 'killPips';
      for(var pi = 0; pi < rk; pi++) pips.appendChild(document.createElement('i'));
      row1.appendChild(pips);
    }
    var wIconSrc = weaponIcon(player.displayWeapon || player.activeWeapon);
    if(wIconSrc) row1.appendChild(makeIcon(wIconSrc, 'weaponIc'));
    main.appendChild(row1);

    // linha 2: K / A / D + dinheiro ... granadas | kit, colete
    var row2 = document.createElement('div'); row2.className = 'cRow';
    var stats = document.createElement('div'); stats.className = 'stats';
    [['K', player.kills], ['A', player.assists], ['D', player.deaths]].forEach(function(st){
      var el = document.createElement('span');
      el.appendChild(document.createTextNode(st[0] + ' '));
      var b = document.createElement('b'); b.textContent = st[1] || 0; el.appendChild(b);
      stats.appendChild(el);
    });
    var money = document.createElement('span'); money.className = 'money';
    money.textContent = '$' + (player.money || 0);
    stats.appendChild(money);
    row2.appendChild(stats);

    var gear = document.createElement('div'); gear.className = 'gear';
    (player.utility || []).forEach(function(u){
      if(u === 'weapon_c4') return; // quem carrega a bomba já aparece em vermelho no radar
      var src = weaponIcon(u);
      if(src) gear.appendChild(makeIcon(src));
    });
    var hasEquip = player.hasDefuseKit || player.hasArmor;
    if(gear.children.length && hasEquip){
      var sep = document.createElement('span'); sep.className = 'sep'; gear.appendChild(sep);
    }
    if(player.hasDefuseKit) gear.appendChild(makeIcon(ICONS_PATH + 'defuser.svg'));
    if(player.hasArmor) gear.appendChild(makeIcon(ICONS_PATH + (player.hasHelmet ? 'armor_helmet.svg' : 'armor.svg')));
    row2.appendChild(gear);
    main.appendChild(row2);
    card.appendChild(main);

    // barra de vida na base
    var bar = document.createElement('div'); bar.className = 'hpBar';
    bar.style.width = (dead ? 0 : Math.max(0, Math.min(100, player.health))) + '%';
    card.appendChild(bar);

    container.appendChild(card);
  }

  function renderRoster(container, players, side, offset){
    container.innerHTML = '';
    var bySlot = {};
    players.forEach(function(p){ bySlot[p.hudIndex] = p; });
    for(var i = 0; i < 5; i++){
      renderCard(container, bySlot[offset + i] || null, offset + i, side);
    }
  }

  // =====================================================================
  // RIBBON (histórico de rounds) — construído sozinho a partir da
  // variação do placar entre uma atualização e outra.
  // =====================================================================
  var lastCT = null, lastT = null, history = [];

  // "Morte grudenta": ver uso em render(). Chave = steamId do jogador.
  var deadThisRound = {};
  var lastDeathResetKey = null; // combinação mapa+round
  var lastRoundPhase = null;
  var lastAlivePos = {}; // steamId -> {x,y} - última posição recebida com o jogador VIVO (mundo, não %)
  var deathPos = {};     // steamId -> {x,y} - onde ele morreu; gravado uma vez e não muda mais no round
  var lastDeathRound = null;

  // Numeração 0-9 ESTÁVEL pra partida inteira (não recalculada a cada
  // poll) - se recalculássemos a cada resposta, um jogador que sumisse
  // momentaneamente da lista allplayers (comum logo após morrer) podia
  // reaparecer com outro número, e isso quebrava o X de morte (o slot
  // antigo ficava "sem dono" e era desativado). Reset só acontece junto
  // com resetVisuals() (reinício completo do HUD).
  var hudIndexMap = {};   // steamId -> index (0-9)
  var hudIndexOwner = {}; // index -> steamId
  var lastNick = {};      // steamId -> nick (pra continuar rotulando mesmo se ele sumir momentaneamente)
  var lastTeam = {};      // steamId -> 'CT'/'T'
  var lastPlayerData = {}; // steamId -> último objeto de jogador recebido (pra manter o card se ele sumir da lista)

  // present: steamIds que vieram no poll atual. Se o time estiver cheio,
  // um slot cujo dono NÃO veio neste poll pode ser reaproveitado (ex:
  // jogador desconectou e outro entrou no lugar).
  function assignHudIndex(p, present){
    var idx = hudIndexMap[p.steamId];
    var inRange = idx !== undefined &&
      ((p.team === 'CT' && idx >= 0 && idx <= 4) || (p.team === 'T' && idx >= 5 && idx <= 9));
    if(inRange && (hudIndexOwner[idx] === undefined || hudIndexOwner[idx] === p.steamId)){
      hudIndexOwner[idx] = p.steamId;
      return idx;
    }
    // mudou de time ou nunca teve slot - libera o antigo (se tinha) e pega um novo
    if(idx !== undefined && hudIndexOwner[idx] === p.steamId) delete hudIndexOwner[idx];
    var start = p.team === 'CT' ? 0 : 5;
    for(var i = start; i < start + 5; i++){
      if(hudIndexOwner[i] === undefined){
        hudIndexMap[p.steamId] = i;
        hudIndexOwner[i] = p.steamId;
        return i;
      }
    }
    for(var j = start; j < start + 5; j++){
      var owner = hudIndexOwner[j];
      if(present[owner]) continue;
      delete hudIndexMap[owner];
      delete lastPlayerData[owner];
      hudIndexMap[p.steamId] = j;
      hudIndexOwner[j] = p.steamId;
      return j;
    }
    return undefined; // mais de 5 no time (não deveria acontecer em 5x5) - ignora
  }

  // Última arma "de verdade" (principal/secundária) que cada jogador
  // segurou - usado pra continuar mostrando a arma no card mesmo quando
  // ele tem uma utilitária/granada na mão no momento.
  var lastGunWeapon = {}; // steamId -> nome da arma (ex: "weapon_ak47")
  var NON_GUN_WEAPONS = [
    'weapon_hegrenade', 'weapon_flashbang', 'weapon_smokegrenade', 'weapon_molotov',
    'weapon_incgrenade', 'weapon_decoy', 'weapon_healthshot', 'weapon_c4', 'weapon_taser'
  ];
  function isGunWeapon(name){
    if(!name) return false;
    if(name.indexOf('knife') !== -1 || name === 'weapon_bayonet') return false;
    return NON_GUN_WEAPONS.indexOf(name) === -1;
  }

  // ---- rastreador local de fase, pra estimar o timer quando o servidor
  // não manda o valor exato (o que só acontece espectando/GOTV) ----
  var phaseTracker = { name: null, startedAt: 0 };
  var bombTracker = { planted: false, startedAt: 0, explodeAt: 0 };
  var defuseTracker = { active: false, startedAt: 0, total: 0, endAt: 0 };

  function updateTrackers(state){
    var phase = (state.roundPhase || '').toLowerCase();
    if(phase !== phaseTracker.name){
      phaseTracker.name = phase;
      phaseTracker.startedAt = Date.now();
    }
    var planted = (state.bombState || '').toLowerCase() === 'planted';
    if(planted !== bombTracker.planted){
      bombTracker.planted = planted;
      bombTracker.startedAt = Date.now();
      bombTracker.explodeAt = 0;
    }
  }

  // ---- barras da bomba plantada (vermelha) e do defuse (azul) ----
  // O GSI manda bomb.countdown: com a bomba "planted" é o tempo até
  // explodir; com "defusing" é o tempo que falta pro defuse terminar
  // (só espectando). Sem isso, estimamos pelo relógio local.
  var DEFUSE_SECONDS = 10, DEFUSE_KIT_SECONDS = 5;

  function updateBombBars(state, serverLeft){
    var now = Date.now();
    var bomb = state.bomb || {};
    var bState = (bomb.state || '').toLowerCase();
    var countdown = typeof bomb.countdown === 'number' && bomb.countdown > 0 ? bomb.countdown : null;
    var phaseName = (state.phaseCountdownName || '').toLowerCase();

    // hora da explosão: valor do jogo quando existe, senão a estimativa
    if(bState === 'planted' && countdown !== null) bombTracker.explodeAt = now + countdown * 1000;
    else if(phaseName === 'bomb' && serverLeft !== null) bombTracker.explodeAt = now + serverLeft * 1000;
    else if(!bombTracker.explodeAt) bombTracker.explodeAt = bombTracker.startedAt + BOMB_TOTAL_SECONDS * 1000;
    var left = Math.max(0, (bombTracker.explodeAt - now) / 1000);
    $('bombBarFill').style.width = Math.min(100, Math.max(0, (BOMB_TOTAL_SECONDS - left) / BOMB_TOTAL_SECONDS * 100)) + '%';

    var mainBar = document.querySelector('.spine-main');
    if(bState !== 'defusing'){
      if(defuseTracker.active){
        defuseTracker.active = false;
        mainBar.classList.remove('defusing');
        var fill = $('defuseBarFill');
        fill.style.transition = 'none'; fill.style.width = '0%'; // próximo defuse começa do zero
      }
      return;
    }

    if(!defuseTracker.active){
      defuseTracker = { active: true, startedAt: now, total: 0, endAt: 0 };
      $('defuseBarFill').style.transition = '';
      mainBar.classList.add('defusing');
    }
    var defuseLeft = countdown !== null ? countdown
      : (phaseName === 'defuse' && serverLeft !== null ? serverLeft : null);
    if(defuseLeft !== null){
      // 1º valor define se é com kit (5s) ou sem (10s)
      if(!defuseTracker.total) defuseTracker.total = defuseLeft > DEFUSE_KIT_SECONDS + 0.5 ? DEFUSE_SECONDS : DEFUSE_KIT_SECONDS;
      defuseTracker.endAt = now + defuseLeft * 1000;
    } else if(!defuseTracker.total){
      defuseTracker.total = defuserHasKit(state) ? DEFUSE_KIT_SECONDS : DEFUSE_SECONDS;
      defuseTracker.endAt = defuseTracker.startedAt + defuseTracker.total * 1000;
    }
    var remaining = Math.max(0, (defuseTracker.endAt - now) / 1000);
    $('defuseBarFill').style.width = Math.min(100, Math.max(0, (1 - remaining / defuseTracker.total) * 100)) + '%';
  }

  // Sem contador do jogo: supõe que quem está desarmando é o CT vivo mais
  // perto da bomba, e usa o kit dele.
  function defuserHasKit(state){
    var bp = state.bomb && state.bomb.position;
    var best = null, bestD = Infinity;
    (state.players || []).forEach(function(p){
      if(p.team !== 'CT' || p.health <= 0) return;
      var pos = p.position;
      var d = (bp && pos && !(pos.x === 0 && pos.y === 0)) ? Math.hypot(pos.x - bp.x, pos.y - bp.y) : Infinity;
      if(best === null || d < bestD){ best = p; bestD = d; }
    });
    return !!(best && best.hasDefuseKit);
  }

  // Segundos restantes estimados desde que a fase começou (client-side).
  function estimatedSecondsLeft(tracker, totalSeconds){
    var elapsed = (Date.now() - tracker.startedAt) / 1000;
    return Math.max(0, totalSeconds - elapsed);
  }

  // Histórico salvo no navegador (localStorage), por isso sobrevive ao F5.
  // Chave única; guarda de qual mapa é e o placar no momento.
  var HISTORY_KEY = 'cs2hud.roundHistory';
  var roundsPrimed = false;
  var historyMap = null;

  function saveHistory(){
    try {
      localStorage.setItem(HISTORY_KEY, JSON.stringify({ map: historyMap, ct: lastCT, t: lastT, history: history }));
    } catch(e){ /* sem storage (modo privado etc): só não persiste */ }
  }

  function loadHistory(){
    try {
      var saved = JSON.parse(localStorage.getItem(HISTORY_KEY) || 'null');
      if(saved && Array.isArray(saved.history)) return saved;
    } catch(e){}
    return null;
  }

  function trackRounds(ct, t, mapName){
    var changed = false;
    if(lastCT === null){
      changed = true;
      // Primeiro dado desde que a página abriu: tenta continuar o histórico
      // salvo, se for a mesma partida (mesmo mapa e placar não diminuiu).
      var saved = loadHistory();
      if(saved && saved.map === mapName && ct >= saved.ct && t >= saved.t &&
         saved.history.length === saved.ct + saved.t){
        history = saved.history.slice();
        lastCT = saved.ct; lastT = saved.t;
      } else {
        history = [];
        lastCT = 0; lastT = 0;
      }
      historyMap = mapName;
    }
    if(mapName !== historyMap || ct < lastCT || t < lastT){
      // trocou de mapa ou placar zerou (partida nova)
      history = []; lastCT = 0; lastT = 0; historyMap = mapName;
      changed = true;
    }
    var winner = null;
    if(ct - lastCT === 1 && t === lastT){ history.push('ct'); changed = true; winner = 'ct'; }
    else if(t - lastT === 1 && ct === lastCT){ history.push('tr'); changed = true; winner = 'tr'; }
    // popup só pra round que a HUD viu acabar (não no primeiro dado após abrir/F5)
    if(winner && roundsPrimed) showRoundWinner(winner, ct + t);
    roundsPrimed = true;
    // rounds que passaram sem a HUD ver (estava fechada / pulou vários):
    // marcador cinza, pra divisória do intervalo continuar no lugar certo
    while(history.length < ct + t){ history.push('unk'); changed = true; }
    lastCT = ct; lastT = t;
    if(changed) saveHistory();
  }

  // Troca de lado: CS2 competitivo é MR12 (intervalo após o round 12) e o
  // overtime é MR3 (troca a cada 3 rounds). Ajuste se usar outro formato.
  var HALF_ROUNDS = 12;
  var OT_HALF_ROUNDS = 3;
  function isSideSwitchAfter(roundNumber){
    if(roundNumber === HALF_ROUNDS) return true;
    if(roundNumber > HALF_ROUNDS * 2) return (roundNumber - HALF_ROUNDS * 2) % OT_HALF_ROUNDS === 0;
    return false;
  }

  function renderRibbon(){
    var box = $('ribbon');
    box.innerHTML = '';
    history.forEach(function(side, i){
      var u = document.createElement('u');
      if(side === 'ct') u.style.background = 'var(--ct)';
      else if(side === 'tr') u.style.background = 'var(--tr)';
      else u.className = 'unk';
      box.appendChild(u);
      // divisória depois do último round de cada metade
      if(isSideSwitchAfter(i + 1)){
        var sep = document.createElement('span');
        sep.className = 'half';
        box.appendChild(sep);
      }
    });
  }

  // =====================================================================
  // TIMES (nome + logo, configurados no control.html) e POPUP DE ROUND
  // =====================================================================
  var DEFAULT_TEAM = {
    ct: { label: 'COUNTER', full: 'COUNTER-TERRORIST', tag: 'CT' },
    tr: { label: 'TERRORIST', full: 'TERRORIST', tag: 'TR' }
  };
  var currentTeams = { ct: null, tr: null }; // {name, logoUrl} ou null (= padrão)

  function applyTeams(teamsCfg, gsiNames){
    teamsCfg = teamsCfg || {};
    currentTeams.ct = teamsCfg.ct || null;
    currentTeams.tr = teamsCfg.t || null;
    var bestOf = teamsCfg.bestOf || 0;
    var mapsToWin = bestOf ? Math.ceil(bestOf / 2) : 0; // MD1=1, MD3=2, MD5=3, MD7=4
    ['ct', 'tr'].forEach(function(side){
      var cfg = currentTeams[side];

      // quadrados da série - só redesenha se mudou
      var wins = Math.min(mapsToWin, (cfg && cfg.mapWins) || 0);
      var seriesEl = $(side + 'Series');
      var seriesKey = mapsToWin + '/' + wins;
      if(seriesEl.dataset.key !== seriesKey){
        seriesEl.dataset.key = seriesKey;
        seriesEl.innerHTML = '';
        // de baixo pra cima: o 1º mapa vencido acende o quadrado de baixo
        for(var i = mapsToWin - 1; i >= 0; i--){
          var box = document.createElement('i');
          if(i < wins) box.className = 'won';
          seriesEl.appendChild(box);
        }
      }

      // nome do painel > nome que o próprio jogo manda (torneios) > padrão
      var gsiName = gsiNames[side];
      if(gsiName === 'CT' || gsiName === 'T') gsiName = ''; // exportador usa isso quando não há nome
      var name = (cfg && cfg.name) || gsiName || DEFAULT_TEAM[side].label;
      var lbl = $(side + 'Label');
      if(lbl.textContent !== name) lbl.textContent = name;

      // logo no lugar do "CT"/"TR" - só mexe no DOM se mudou (senão a
      // imagem recarregaria a cada atualização)
      var tag = $(side + 'Tag');
      var logo = cfg && cfg.logoUrl ? API_BASE + cfg.logoUrl : '';
      if(tag.dataset.logo === logo) return;
      tag.dataset.logo = logo;
      if(logo){
        tag.className = 'tag logo ' + side;
        tag.innerHTML = '';
        var img = document.createElement('img');
        img.src = logo;
        img.onerror = function(){ tag.dataset.logo = ''; tag.className = 'tag ' + side; tag.textContent = DEFAULT_TEAM[side].tag; };
        tag.appendChild(img);
      } else {
        tag.className = 'tag ' + side;
        tag.textContent = DEFAULT_TEAM[side].tag;
      }
    });
  }

  var roundWinTimer = null;
  function showRoundWinner(side, roundNumber){
    var cfg = currentTeams[side];
    var box = $('roundWin');
    $('rwName').textContent = (cfg && cfg.name) || DEFAULT_TEAM[side].full;
    $('rwSub').textContent = 'venceu o round ' + roundNumber;
    var logo = $('rwLogo');
    if(cfg && cfg.logoUrl){ logo.src = API_BASE + cfg.logoUrl; logo.style.display = 'block'; }
    else { logo.removeAttribute('src'); logo.style.display = 'none'; }
    box.className = 'roundWin ' + side;
    void box.offsetWidth; // reinicia a animação se dois rounds vierem seguidos
    box.classList.add('show');
    clearTimeout(roundWinTimer);
    roundWinTimer = setTimeout(function(){ box.classList.remove('show'); }, ROUND_WIN_POPUP_MS);
  }

  // =====================================================================
  // TELA DE PAUSA / TIMEOUT
  // =====================================================================
  var TIMEOUTS_PER_TEAM = 3; // mp_team_timeout_max do servidor (padrão competitivo)

  // Loss bonus do CS2 se o time perder o próximo round: $1400 + $500 por
  // derrota seguida, até $3400.
  function lossBonus(losses){ return 1400 + 500 * Math.min(Math.max(losses || 0, 0), 4); }
  function fmtMoney(v){ return '$' + (v || 0).toLocaleString('en-US'); }
  function teamName(side){ var c = currentTeams[side]; return (c && c.name) || DEFAULT_TEAM[side].label; }
  function teamLogo(side){ var c = currentTeams[side]; return c && c.logoUrl ? API_BASE + c.logoUrl : ''; }
  function esc(t){ var d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; }

  function pauseInfo(state, teamsCfg){
    var phase = (state.phaseCountdownName || '').toLowerCase().replace('timeoutct', 'timeout_ct').replace('timeoutt', 'timeout_t');
    if(phase === 'timeout_ct') return { title: 'TIMEOUT', side: 'ct' };
    if(phase === 'timeout_t') return { title: 'TIMEOUT', side: 'tr' };
    if(phase === 'paused') return { title: 'PAUSA TÉCNICA', side: null };
    if(teamsCfg && teamsCfg.forcePause) return { title: 'PAUSA', side: null };
    return null;
  }

  function renderPause(state, ctPlayers, tPlayers){
    var info = pauseInfo(state, state.teams);
    var stage = $('stage');
    if(!info){ stage.classList.remove('paused'); return; }
    stage.classList.add('paused');
    var sb = state.scoreboard;

    // coaches (só aparece quem tem nome definido no control.html)
    [['ct', 'pCoachCT'], ['tr', 'pCoachT']].forEach(function(r){
      var c = currentTeams[r[0]];
      $(r[1]).innerHTML = c && c.coach ? '<span class="ck">COACH</span><span class="cn">' + esc(c.coach) + '</span>' : '';
    });

    // valor de equipamento / loss bonus / timeouts restantes
    [['ct', 'pStatsCT', ctPlayers, sb.ct], ['tr', 'pStatsT', tPlayers, sb.t]].forEach(function(r){
      var equip = r[2].reduce(function(sum, p){ return sum + (p.equipmentValue || 0); }, 0);
      var left = r[3].timeoutsRemaining || 0;
      var total = Math.max(TIMEOUTS_PER_TEAM, left);
      var boxes = '';
      for(var i = 0; i < total; i++) boxes += '<i class="' + (i < left ? 'on' : '') + '"></i>';
      var cells = [
        '<div class="pStat"><span class="k">Equipamento</span><span class="v">' + fmtMoney(equip) + '</span></div>',
        '<div class="pStat"><span class="k">Loss bonus</span><span class="v">' + fmtMoney(lossBonus(r[3].consecutiveRoundLosses)) + '</span></div>',
        '<div class="pStat"><span class="k">Timeouts</span><span class="pTimeouts">' + boxes + '</span></div>'
      ];
      if(r[0] === 'tr') cells.reverse(); // espelhado do lado direito
      $(r[1]).innerHTML = cells.join('');
    });

    // centro do cabeçalho: logo NOME  6 vs 3  NOME logo
    var lc = teamLogo('ct'), lt = teamLogo('tr');
    $('pCenter').innerHTML =
      (lc ? '<img src="' + lc + '">' : '') + '<span class="tn ctc">' + esc(teamName('ct')) + '</span>' +
      '<span class="sc">' + sb.ct.score + '</span><span class="vs">VS</span><span class="sc">' + sb.t.score + '</span>' +
      '<span class="tn trc">' + esc(teamName('tr')) + '</span>' + (lt ? '<img src="' + lt + '">' : '');

    // tabelas de jogadores
    [['pTableCT', ctPlayers], ['pTableT', tPlayers]].forEach(function(r){
      var rows = r[1].slice().sort(function(a, b){ return a.hudIndex - b.hudIndex; });
      $(r[0]).innerHTML = rows.map(function(p){
        var eq = '';
        if(p.hasArmor) eq += '<img class="ic" src="' + ICONS_PATH + (p.hasHelmet ? 'armor_helmet.svg' : 'armor.svg') + '">';
        if(p.hasDefuseKit) eq += '<img class="ic" src="' + ICONS_PATH + 'defuser.svg">';
        var util = (p.utility || []).filter(function(u){ return u !== 'weapon_c4'; }).map(function(u){
          var src = weaponIcon(u); return src ? '<img class="ic" src="' + src + '">' : '';
        }).join('');
        if((p.utility || []).indexOf('weapon_c4') !== -1) util += '<img class="ic" src="' + ICONS_PATH + 'c4.svg">';
        var guns = [p.secondary, p.primary].filter(Boolean).map(function(w){
          return '<img class="ic" src="' + weaponIcon(w) + '">';
        }).join('');
        return '<div class="pRow' + (p.isDead ? ' dead' : '') + '">' +
          '<span class="pn">' + esc(p.nick) + '</span>' +
          '<span class="pIcons">' + eq + '</span>' +
          '<span class="pIcons">' + util + '</span>' +
          '<span class="pGuns">' + guns + '</span>' +
          '<span class="pm">' + fmtMoney(p.money) + '</span></div>';
      }).join('');
    });

    // centro: quem pediu o timeout + contagem
    var mid = '<span class="t1">' + info.title + '</span>';
    if(info.side){
      var sideScore = info.side === 'ct' ? sb.ct : sb.t;
      var used = Math.max(1, TIMEOUTS_PER_TEAM - (sideScore.timeoutsRemaining || 0));
      var logo = teamLogo(info.side);
      mid += '<span class="t2 ' + info.side + '">' + (logo ? '<img src="' + logo + '">' : '') + esc(teamName(info.side)) + '</span>' +
             '<span class="t3">TIMEOUT ' + used + '/' + TIMEOUTS_PER_TEAM + '</span>';
    }
    var left = typeof state.phaseSecondsLeft === 'number' && state.phaseSecondsLeft > 0 && (info.side || info.title === 'PAUSA TÉCNICA')
      ? state.phaseSecondsLeft : null;
    if(left !== null) mid += '<span class="clock">' + fmtClock(left) + '</span>';
    $('pMid').innerHTML = mid;
  }

  // "de_dust2" -> "DUST2"
  function mapDisplayName(map){
    if(!map) return '—';
    return map.replace(/^(de|cs|ar|dz)_/i, '').replace(/_/g, ' ').toUpperCase();
  }

  // =====================================================================
  // PAINEL "ESPECTANDO AGORA"
  // =====================================================================
  // Mira: aparece com qualquer coisa na mão (arma, pistola, faca, zeus,
  // granada, C4...) - exceto os rifles de precisão, que no jogo não têm
  // mira (só pela luneta).
  var NO_CROSSHAIR_WEAPONS = ['weapon_awp', 'weapon_ssg08', 'weapon_scar20', 'weapon_g3sg1'];
  function showsCrosshair(weapon){
    return !!weapon && NO_CROSSHAIR_WEAPONS.indexOf(weapon) === -1;
  }

  function renderCrosshair(player){
    var on = !!player && player.health > 0 && showsCrosshair(player.activeWeapon);
    $('crosshair').classList.toggle('show', on);
  }

  function renderSpectator(player){
    renderCrosshair(player);
    var panel = $('specPanel');
    if(!player){
      panel.style.display = 'none';
      return;
    }
    panel.style.display = 'flex';
    panel.className = 'specPanel ' + (player.team === 'CT' ? 'ct' : 'tr');

    $('specNick').textContent = player.nick || '?';
    $('specTeam').textContent = player.team || '';
    $('specTeam').style.color = player.team === 'CT' ? 'var(--ct)' : 'var(--tr)';
    $('specKills').textContent = player.kills;
    $('specDeaths').textContent = player.deaths;
    $('specMoney').textContent = '$' + (player.money || 0);
    $('specHp').textContent = player.health <= 0 ? '—' : player.health;
    $('specHp').className = 'specHp ' + hpClass(player.health);

    // mesma lógica dos cards: se a arma ativa é utilitário/granada, mostra
    // a última arma principal/secundária que ele segurou (cache global
    // lastGunWeapon, já alimentado pelo loop de players em render()).
    var dispWeapon = isGunWeapon(player.activeWeapon)
      ? player.activeWeapon
      : (lastGunWeapon[player.steamId] || player.activeWeapon);
    var wIcon = weaponIcon(dispWeapon);
    var wEl = $('specWeapon');
    if(wIcon){ wEl.src = wIcon; wEl.style.display = 'block'; wEl.onerror = function(){ onIconError(wEl); }; }
    else { wEl.style.display = 'none'; }

    // munição da arma ativa (clipe atual / clipe máximo + reserva). Armas
    // sem pente (faca, granadas, C4) vêm com ammoClipMax = 0, aí escondemos.
    var ammoEl = $('specAmmo');
    if(player.ammoClipMax > 0){
      ammoEl.style.display = 'block';
      ammoEl.innerHTML = '<b>' + player.ammoClip + '</b> / ' + player.ammoClipMax +
        ' <span class="reserve">+' + player.ammoReserve + '</span>';
    } else {
      ammoEl.style.display = 'none';
    }
  }

  // =====================================================================
  // RADAR
  // =====================================================================
  // O CS2/GSI não manda posição 60x por segundo (normalmente bem menos,
  // depende do "throttle"/"buffer" do .cfg). Pra parecer fluido mesmo
  // assim, a gente separa duas coisas:
  //  1) chegada de dados novos (rede) -> só atualiza o "alvo" de cada ponto
  //  2) desenho na tela (requestAnimationFrame) -> roda no refresh rate
  //     do monitor (60fps, 144fps, o que for) e vai suavizando o ponto
  //     em direção ao alvo a cada frame, em vez de teleportar.
  // Isso é a mesma ideia de interpolação usada em jogos multiplayer.
  // Suavização do radar: o CS2 só manda posição algumas vezes por segundo
  // (buffer/throttle do GSI), então em vez de "correr atrás" do alvo (que
  // anda aos trancos a cada pacote), interpolamos com velocidade constante
  // entre a posição anterior e a nova, ao longo do intervalo médio real
  // entre pacotes. Isso atrasa o ponto em ~1 pacote, mas o movimento fica
  // contínuo no refresh rate do navegador (60fps).
  var INTERP_MIN_MS = 30;    // limites do intervalo estimado entre pacotes
  var INTERP_MAX_MS = 400;
  var INTERP_STRETCH = 1.15; // anima um pouco mais devagar que o intervalo real, pra não "parar" quando um pacote atrasa
  var SNAP_DISTANCE_PCT = 20; // salto maior que isso (respawn, troca de lado) = teleporta, sem animar

  function setSlotTarget(slot, x, y){
    if(x === slot.tgtX && y === slot.tgtY) return; // mesmo pacote de antes, nada novo
    var now = performance.now();
    if(slot.lastUpdateAt){
      var dt = now - slot.lastUpdateAt;
      if(dt < 1000) slot.interval = slot.interval * 0.7 + Math.min(INTERP_MAX_MS, Math.max(INTERP_MIN_MS, dt)) * 0.3;
    }
    var far = Math.abs(x - slot.curX) > SNAP_DISTANCE_PCT || Math.abs(y - slot.curY) > SNAP_DISTANCE_PCT;
    if(!slot.visible || far){
      slot.fromX = slot.curX = x;
      slot.fromY = slot.curY = y;
    } else {
      // parte de onde o ponto está desenhado AGORA (sem pulo)
      slot.fromX = slot.curX;
      slot.fromY = slot.curY;
    }
    slot.tgtX = x;
    slot.tgtY = y;
    slot.lastUpdateAt = now;
  }

  function worldToRadarPct(x, y, mapName){
    var cal = RADAR_CAL[mapName];
    if(!cal) return null;
    var scale = cal.scale * 1024;
    return {
      xPct: (x - cal.x) / scale * 100,
      yPct: (y - cal.y) / -scale * 100
    };
  }

  var lastRadarMap = null;
  // O GSI às vezes manda um pacote sem as posições (acontece muito ao trocar
  // de jogador na câmera). Em vez de reagir na hora (aviso piscando, pontos
  // sumindo e voltando), toleramos essas falhas curtas:
  var POS_GRACE_MS = 1500;   // ponto vivo sem posição continua no último lugar por até isso
  var HINT_DELAY_MS = 2500;  // aviso "Posições só chegam..." só aparece depois disso sem NENHUMA posição
  var lastAnyPosAt = 0;
  var BOMB_SLOT = 10; // índice reservado no array radarSlots pro marcador da bomba (não é jogador)

  // Cria os 10 pontos de jogador (0-9) + 1 slot extra pra bomba, uma
  // única vez - recriar elementos DOM a cada frame é o que estava
  // travando o radar antes.
  var radarSlots = [];
  (function initRadarSlots(){
    var box = $('radarBox');
    for(var i = 0; i < 11; i++){
      var el = document.createElement('div');
      el.className = 'dot';
      el.style.display = 'none';

      var num = document.createElement('span');
      num.className = 'dotNum';
      var icon = document.createElement('img');
      icon.className = 'dotIcon';
      icon.onerror = function(){ this.style.display = 'none'; }; // se o c4.svg faltar, o círculo vermelho continua visível
      el.appendChild(num);
      el.appendChild(icon);

      box.appendChild(el);
      radarSlots.push({ el: el, numEl: num, iconEl: icon, curX: 50, curY: 50, tgtX: 50, tgtY: 50, fromX: 50, fromY: 50,
        lastUpdateAt: 0, interval: 100, visible: false, active: false, drawnX: null, drawnY: null, lastPosAt: 0 });
    }
  })();

  // Chamado a cada poll (rede) - só atualiza ONDE cada ponto deve ir,
  // nunca mexe em style.left/top diretamente. Quem desenha é o loop de
  // animação (radarAnimLoop), separado e rodando a 60fps.
  function renderRadar(players, mapName, bomb){
    // troca a imagem do mapa só quando o mapa muda (evita recarregar o
    // arquivo a cada poll).
    if(mapName !== lastRadarMap){
      lastRadarMap = mapName;
      var mapImg = $('radarMapImg');
      mapImg.onerror = function(){ mapImg.style.display = 'none'; $('radarGrid').style.display = 'block'; };
      mapImg.onload = function(){ mapImg.style.display = 'block'; $('radarGrid').style.display = 'none'; };
      mapImg.src = mapName ? (MAPS_PATH + mapName + '.png') : '';
    }

    var cal = RADAR_CAL[mapName];
    var withPos = players.filter(function(p){
      return p.position && !(p.position.x === 0 && p.position.y === 0 && p.position.z === 0);
    });

    var hint = $('radarHint');
    if(!cal){
      hint.style.display = 'flex';
      hint.textContent = 'Sem calibração de radar para "' + (mapName || '?') + '"';
      radarSlots.forEach(function(s){ s.active = false; });
      return;
    }
    var nowMs = performance.now();
    if(withPos.length) lastAnyPosAt = nowMs;
    if(!withPos.length && nowMs - lastAnyPosAt > HINT_DELAY_MS){
      hint.style.display = 'flex';
      hint.textContent = 'Posições só chegam quando você está espectando a partida (allplayers_position)';
      // IMPORTANTE: sem "return" aqui - mesmo sem ninguém reportando
      // posição AGORA, o loop abaixo ainda pode desenhar o X de quem
      // morreu usando a posição gravada na morte (deathPos).
    } else if(withPos.length){
      hint.style.display = 'none';
    }

    var bState = ((bomb && bomb.state) || '').toLowerCase();
    // O node "bomb" do exportador não informa QUEM está com ela, então
    // descobrimos o portador pelo inventário: quem tem a weapon_c4 nas
    // utilitárias (ou na mão). Só existe uma C4, então no máximo um jogador.
    var BOMB_FREE_STATES = ['dropped', 'planting', 'planted', 'defusing', 'exploded', 'defused'];
    var bombCarrierSteamId = null;
    if(BOMB_FREE_STATES.indexOf(bState) === -1){
      players.forEach(function(p){
        if(bombCarrierSteamId !== null || p.isDead) return;
        var hasC4 = p.activeWeapon === 'weapon_c4' || (p.utility || []).indexOf('weapon_c4') !== -1;
        if(hasC4) bombCarrierSteamId = p.steamId;
      });
    }

    // marca todo mundo inativo antes, e só reativa quem tem posição válida
    // agora (assim, quem desconectou de vez some do radar)
    var seen = {};

    players.forEach(function(p){
      if(typeof p.hudIndex !== 'number') return;
      var slot = radarSlots[p.hudIndex];
      if(!slot) return;

      var hasPos = p.position && !(p.position.x === 0 && p.position.y === 0 && p.position.z === 0);

      if(p.isDead){
        // X fica cravado onde ele morreu: a última posição vista com ele
        // VIVO. Depois da morte o GSI manda a posição da CÂMERA do morto
        // (que segue um companheiro vivo) - essa nunca é usada. Se a HUD
        // não viu o jogador vivo neste round (abriu depois da morte e não
        // tinha nada salvo), é melhor não mostrar X do que mostrar errado.
        if(!deathPos[p.steamId] && lastAlivePos[p.steamId]){
          var src = lastAlivePos[p.steamId];
          deathPos[p.steamId] = { x: src.x, y: src.y };
        }
      } else if(hasPos){
        lastAlivePos[p.steamId] = { x: p.position.x, y: p.position.y };
      }

      var worldPos = p.isDead ? deathPos[p.steamId] : (hasPos ? p.position : null);
      if(!worldPos){
        // pacote sem posição: se o ponto estava visível há pouco, mantém
        // parado no último lugar em vez de sumir e voltar (evita piscar)
        // (só pra vivo - X de morte sem posição some na hora)
        if(!p.isDead && slot.active && !slot.isDeadMark && nowMs - slot.lastPosAt < POS_GRACE_MS) seen[p.hudIndex] = true;
        else slot.active = false;
        return;
      }

      var pos = worldToRadarPct(worldPos.x, worldPos.y, mapName);
      if(!pos || pos.xPct < 0 || pos.xPct > 100 || pos.yPct < 0 || pos.yPct > 100){ slot.active = false; return; }

      slot.active = true;
      slot.lastPosAt = nowMs;
      setSlotTarget(slot, pos.xPct, pos.yPct);

      slot.isDeadMark = !!p.isDead;
      if(p.isDead){
        // "X" translúcido na cor do time, no lugar onde ele morreu
        slot.el.className = 'dot dead ' + (p.team === 'CT' ? 'ct' : 'tr');
        slot.el.title = p.nick + ' (morto)';
        slot.numEl.textContent = '✕';
        slot.iconEl.style.display = 'none';
      } else if(bombCarrierSteamId !== null && String(p.steamId) === String(bombCarrierSteamId)){
        // com a bomba na mão: o próprio ponto do jogador fica vermelho.
        slot.el.className = 'dot bombCarrier';
        slot.el.title = p.nick + ' (com a bomba)';
        slot.numEl.textContent = String(p.hudIndex);
        slot.iconEl.style.display = 'none';
      } else {
        slot.el.className = 'dot ' + (p.team === 'CT' ? 'ct' : 'tr');
        slot.el.title = p.nick;
        slot.numEl.textContent = String(p.hudIndex);
        slot.iconEl.style.display = 'none';
      }
      seen[p.hudIndex] = true;
    });

    // fallback: jogador morto que sumiu momentaneamente da lista allplayers
    // (acontece às vezes logo após a morte) continua mostrando o X na
    // última posição conhecida, em vez de desaparecer e reaparecer.
    radarSlots.forEach(function(s, i){
      if(i === BOMB_SLOT || seen[i]) return;
      var ownerSteamId = hudIndexOwner[i];
      if(ownerSteamId && deadThisRound[ownerSteamId] && deathPos[ownerSteamId]){
        var fallbackPos = worldToRadarPct(deathPos[ownerSteamId].x, deathPos[ownerSteamId].y, mapName);
        if(fallbackPos && fallbackPos.xPct >= 0 && fallbackPos.xPct <= 100 && fallbackPos.yPct >= 0 && fallbackPos.yPct <= 100){
          s.active = true;
          s.isDeadMark = true;
          setSlotTarget(s, fallbackPos.xPct, fallbackPos.yPct);
          var team = lastTeam[ownerSteamId] || 'CT';
          s.el.className = 'dot dead ' + (team === 'CT' ? 'ct' : 'tr');
          s.el.title = (lastNick[ownerSteamId] || '?') + ' (morto)';
          s.numEl.textContent = '✕';
          s.iconEl.style.display = 'none';
          return;
        }
      }
      // jogador sumiu da lista neste pacote: mesma tolerância de cima
      if(s.active && !s.isDeadMark && nowMs - s.lastPosAt < POS_GRACE_MS) return;
      s.active = false;
    });

    // ---- marcador da bomba largada/plantada (posição exata do node
    // "bomb" do GSI). Enquanto ela está sendo CARREGADA, quem mostra isso
    // é o próprio ponto do jogador (acima) - esse marcador aqui só entra
    // em cena quando ela está largada, sendo plantada, plantada, ou sendo
    // desarmada (ou seja, ninguém está com ela na mão).
    var bombSlot = radarSlots[BOMB_SLOT];
    var bombOnGround = ['dropped', 'planting', 'planted', 'defusing'].indexOf(bState) !== -1;
    var bPos = bomb && bomb.position;
    var bombHasPos = bPos && !(bPos.x === 0 && bPos.y === 0 && bPos.z === 0);

    if(cal && bombOnGround && bombHasPos){
      var bpos = worldToRadarPct(bPos.x, bPos.y, mapName);
      if(bpos && bpos.xPct >= 0 && bpos.xPct <= 100 && bpos.yPct >= 0 && bpos.yPct <= 100){
        bombSlot.active = true;
        setSlotTarget(bombSlot, bpos.xPct, bpos.yPct);
        var isPlanted = bState === 'planted' || bState === 'defusing';
        bombSlot.el.className = 'dot bomb' + (isPlanted ? ' planted' : '');
        bombSlot.el.title = 'Bomba: ' + bState + (isPlanted ? ' (local exato)' : '');
        bombSlot.numEl.textContent = '';
        bombSlot.iconEl.style.display = 'block';
        bombSlot.iconEl.src = ICONS_PATH + 'c4.svg';
      } else {
        bombSlot.active = false;
      }
    } else {
      bombSlot.active = false;
    }
  }

  // =====================================================================
  // UTILITÁRIOS NO RADAR (trajetória + fumaça + fogo)
  // =====================================================================
  // Vem do nó "grenades" do GSI (via exportador). Cada granada tem um id
  // estável enquanto existe; guardamos os pontos por onde ela passou pra
  // desenhar a trajetória. Tipos do GSI: smoke, flashbang, frag, decoy,
  // firebomb (molotov/incendiária em voo) e inferno (o fogo queimando).
  var UTIL_COLORS = {
    smoke: '#D6DBE0', flashbang: '#FFF3A0', frag: '#E0645A',
    firebomb: '#FF8A3D', decoy: '#8FD18F'
  };
  var TRAIL_LINGER_MS = 2500;  // trajetória continua visível depois que a granada para/some
  var UTIL_GRACE_MS = 1500;    // pacote sem a granada (troca de câmera etc) não apaga na hora
  var SMOKE_MAX_MS = 22000;    // trava de segurança: fumaça do CS2 dura ~20s
  var SMOKE_RADIUS_UNITS = 144; // raio aproximado da fumaça no jogo
  var utilState = {};          // id -> {type, trail[], lastSeenAt, stoppedAt, poppedAt, pos, radiusPct}
  var SVG_NS = 'http://www.w3.org/2000/svg';
  var SMOKE_ICON = '<svg viewBox="0 0 24 24"><path d="M6.5 19a4.5 4.5 0 0 1-.9-8.9A6 6 0 0 1 17.3 8.6 4.5 4.5 0 0 1 17.5 19z"/></svg>';

  function clearUtility(){
    utilState = {};
    $('utilTrails').innerHTML = '';
    $('utilIcons').innerHTML = '';
  }

  function updateUtility(grenades, mapName){
    var cal = RADAR_CAL[mapName];
    var now = performance.now();
    if(!cal){ clearUtility(); return; }

    grenades.forEach(function(g){
      if(!g || !g.id) return;
      var type = (g.type || '').toLowerCase();
      var u = utilState[g.id];
      if(!u) u = utilState[g.id] = { type: type, trail: [], lastSeenAt: now, stoppedAt: 0, poppedAt: 0, pos: null, radiusPct: 0 };
      u.type = type;
      u.lastSeenAt = now;

      if(type === 'inferno'){
        // centro e raio a partir dos focos de fogo
        var flames = (g.flames || []).map(function(f){ return worldToRadarPct(f.x, f.y, mapName); }).filter(Boolean);
        if(!flames.length && g.position) flames = [worldToRadarPct(g.position.x, g.position.y, mapName)];
        if(!flames.length) return;
        var cx = 0, cy = 0;
        flames.forEach(function(f){ cx += f.xPct; cy += f.yPct; });
        cx /= flames.length; cy /= flames.length;
        var r = 0;
        flames.forEach(function(f){ r = Math.max(r, Math.hypot(f.xPct - cx, f.yPct - cy)); });
        u.pos = { x: cx, y: cy };
        u.radiusPct = r + 1.2; // + raio de um foco
        return;
      }

      var p = g.position && worldToRadarPct(g.position.x, g.position.y, mapName);
      if(!p) return;
      u.pos = { x: p.xPct, y: p.yPct };
      var v = g.velocity || { x: 0, y: 0, z: 0 };
      var moving = Math.abs(v.x) + Math.abs(v.y) + Math.abs(v.z) > 1;
      var last = u.trail[u.trail.length - 1];
      if(!last || Math.hypot(last.x - p.xPct, last.y - p.yPct) > 0.25) u.trail.push({ x: p.xPct, y: p.yPct });
      if(moving) u.stoppedAt = 0;
      else if(!u.stoppedAt) u.stoppedAt = now;

      if(type === 'smoke' && g.effectTime > 0 && !u.poppedAt){
        u.poppedAt = now - g.effectTime * 1000;
        u.radiusPct = SMOKE_RADIUS_UNITS / (cal.scale * 1024) * 100;
      }
    });
  }

  function drawUtility(){
    var now = performance.now();
    var trails = $('utilTrails'), icons = $('utilIcons');
    trails.innerHTML = '';
    icons.innerHTML = '';
    var boxPx = $('radarBox').clientWidth || 340;

    Object.keys(utilState).forEach(function(id){
      var u = utilState[id];
      var missingFor = now - u.lastSeenAt;
      var gone = missingFor > UTIL_GRACE_MS;

      // ---- trajetória (tudo menos o fogo em si) ----
      var trailEndAt = gone ? u.lastSeenAt : (u.stoppedAt || 0);
      var trailAlive = !trailEndAt || now - trailEndAt < TRAIL_LINGER_MS;
      if(u.type !== 'inferno' && u.trail.length > 1 && trailAlive){
        var color = UTIL_COLORS[u.type] || '#EDEFF2';
        var line = document.createElementNS(SVG_NS, 'polyline');
        line.setAttribute('points', u.trail.map(function(pt){ return pt.x.toFixed(2) + ',' + pt.y.toFixed(2); }).join(' '));
        line.setAttribute('stroke', color);
        line.style.opacity = trailEndAt ? String(Math.max(0, 1 - (now - trailEndAt) / TRAIL_LINGER_MS) * 0.9) : '0.9';
        trails.appendChild(line);
        if(!trailEndAt){
          // "cabeça": onde a granada está agora
          var head = u.trail[u.trail.length - 1];
          var c = document.createElementNS(SVG_NS, 'circle');
          c.setAttribute('class', 'head');
          c.setAttribute('cx', head.x); c.setAttribute('cy', head.y); c.setAttribute('r', 0.9);
          c.setAttribute('fill', color);
          trails.appendChild(c);
        }
      }

      // ---- ícone de fumaça (depois que estoura) / fogo ----
      var showSmoke = u.type === 'smoke' && u.poppedAt && !gone && now - u.poppedAt < SMOKE_MAX_MS;
      var showFire = u.type === 'inferno' && !gone && u.pos;
      if(showSmoke || showFire){
        var el = document.createElement('div');
        el.className = 'util ' + (showSmoke ? 'smoke' : 'fire');
        var sizePx = Math.max(20, u.radiusPct * 2 / 100 * boxPx);
        el.style.width = el.style.height = sizePx + 'px';
        el.style.left = u.pos.x + '%';
        el.style.top = u.pos.y + '%';
        if(showSmoke) el.innerHTML = SMOKE_ICON;
        else { var img = document.createElement('img'); img.src = ICONS_PATH + 'inferno.svg'; el.appendChild(img); }
        icons.appendChild(el);
      }

      // esquece de vez quando não há mais nada pra desenhar
      if(gone && !trailAlive) delete utilState[id];
    });
  }

  // Loop de desenho, independente da rede - roda no refresh rate do
  // navegador (tipicamente 60fps). Só aqui a gente toca em style.left/top.
  function radarAnimLoop(now){
    for(var i = 0; i < radarSlots.length; i++){
      var s = radarSlots[i];
      if(!s.active){
        if(s.visible){ s.el.style.display = 'none'; s.visible = false; }
        continue;
      }
      if(!s.visible){
        // reapareceu: começa direto no alvo, sem deslizar de onde sumiu
        s.fromX = s.curX = s.tgtX;
        s.fromY = s.curY = s.tgtY;
        s.el.style.display = 'flex';
        s.visible = true;
      }
      var t = (now - s.lastUpdateAt) / (s.interval * INTERP_STRETCH);
      if(t > 1) t = 1; else if(t < 0) t = 0;
      var x = s.fromX + (s.tgtX - s.fromX) * t;
      var y = s.fromY + (s.tgtY - s.fromY) * t;
      s.curX = x; s.curY = y;
      // compara com o que está de fato no DOM (drawnX/Y), não com curX:
      // quando o ponto aparece ou teletransporta, curX já é o alvo, e
      // comparar com ele fazia o ponto nunca ser posicionado (ficava
      // parado no lugar antigo/canto - bomba largada, X de morte e
      // jogadores parados no freezetime "sumiam" ou "congelavam").
      if(x !== s.drawnX || y !== s.drawnY){
        s.drawnX = x; s.drawnY = y;
        s.el.style.left = x + '%';
        s.el.style.top = y + '%';
      }
    }
    // utilitários: redesenha a ~20fps (suficiente pro fade das trajetórias)
    if(now - lastUtilDrawAt > 50){ lastUtilDrawAt = now; drawUtility(); }
    requestAnimationFrame(radarAnimLoop);
  }
  var lastUtilDrawAt = 0;
  requestAnimationFrame(radarAnimLoop);

  // =====================================================================
  // LOOP PRINCIPAL
  // =====================================================================
  // ---- pacotes parciais do GSI ----
  // Às vezes (troca de câmera etc) o CS2 manda um pacote sem o nó do mapa
  // e/ou do round. O exportador então entrega mapa "", round 0, placar 0x0
  // e fase "" - e isso parecia troca de mapa/partida nova: zerava as
  // mortes (X ia pra posição errada), o histórico de rounds e a bomba.
  // Completa esses campos com os do último pacote completo.
  var lastGoodMap = null, lastGoodRound = null;
  function fillPartialState(state){
    if(state.map){
      lastGoodMap = { map: state.map, round: state.round, phase: state.phase, scoreboard: state.scoreboard };
    } else if(lastGoodMap){
      state.map = lastGoodMap.map; state.round = lastGoodMap.round;
      state.phase = lastGoodMap.phase; state.scoreboard = lastGoodMap.scoreboard;
    }
    if(state.roundPhase){
      lastGoodRound = { roundPhase: state.roundPhase, bombState: state.bombState };
    } else if(lastGoodRound){
      state.roundPhase = lastGoodRound.roundPhase; state.bombState = lastGoodRound.bombState;
    }
  }

  // ---- mortes salvas no navegador (sobrevivem ao F5) ----
  var DEATHS_KEY = 'cs2hud.deaths';
  var deathsRestored = false;
  var lastDeathsSaved = null;
  function saveDeaths(state){
    var data = JSON.stringify({ map: state.map, round: state.round, dead: deadThisRound, pos: deathPos, alive: lastAlivePos });
    if(data === lastDeathsSaved) return;
    lastDeathsSaved = data;
    try { localStorage.setItem(DEATHS_KEY, data); } catch(e){}
  }
  // Só restaura se for o MESMO round: mesmo mapa e mesmo número de round,
  // ou o round seguinte enquanto ainda está na fase "over" (o número do
  // round vira quando ele acaba, mas o X fica até o próximo começar).
  function loadDeaths(state, phase){
    try {
      var saved = JSON.parse(localStorage.getItem(DEATHS_KEY) || 'null');
      if(!saved || saved.map !== state.map || phase === 'freezetime') return;
      var sameRound = state.round === saved.round;
      var justEnded = state.round === saved.round + 1 && phase === 'over';
      if(!sameRound && !justEnded) return;
      deadThisRound = saved.dead || {};
      deathPos = saved.pos || {};
      lastAlivePos = saved.alive || {};
    } catch(e){}
  }

  function render(state){
    fillPartialState(state);
    var ct = state.scoreboard.ct, t = state.scoreboard.t;

    $('scoreCT').textContent = ct.score;
    $('scoreT').textContent = t.score;
    $('scoreCT').className = ct.score >= t.score ? 'lead' : 'trail';
    $('scoreT').className = t.score >= ct.score ? 'lead' : 'trail';
    applyTeams(state.teams, { ct: ct.teamName, tr: t.teamName });
    $('mapName').textContent = mapDisplayName(state.map);
    // map.round do GSI = rounds já jogados; o round em andamento é o próximo
    // (no fim da partida mostra o último jogado).
    var playedRounds = ct.score + t.score;
    var gameOver = (state.phase || '').toLowerCase() === 'gameover';
    $('roundInfo').textContent = 'ROUND ' + (gameOver ? playedRounds : playedRounds + 1);

    // Timer de round / bomba. O servidor só manda o valor EXATO quando
    // alguém está espectando/observando (limitação do GSI da Valve).
    // Jogando normalmente, a gente estima localmente contando o tempo
    // desde que a fase mudou (round.phase e bombState não são restritos).
    updateTrackers(state);

    var bombPlanted = (state.bombState || '').toLowerCase() === 'planted';
    var mainBar = document.querySelector('.spine-main');
    var serverLeft = (typeof state.phaseSecondsLeft === 'number' && state.phaseSecondsLeft >= 0)
      ? state.phaseSecondsLeft : null;

    if(bombPlanted){
      mainBar.classList.add('bomb-planted');
      $('scoreSep').textContent = ':'; // relógio do round não vale mais: quem manda é a barra
      updateBombBars(state, serverLeft);
    } else {
      mainBar.classList.remove('bomb-planted');
      mainBar.classList.remove('defusing');
      defuseTracker.active = false;
      var phase = (state.roundPhase || '').toLowerCase();
      if(phase === 'freezetime'){
        $('scoreSep').textContent = fmtClock(serverLeft !== null ? serverLeft : estimatedSecondsLeft(phaseTracker, FREEZETIME_SECONDS));
      } else if(phase === 'live'){
        $('scoreSep').textContent = fmtClock(serverLeft !== null ? serverLeft : estimatedSecondsLeft(phaseTracker, ROUND_TIME_SECONDS));
      } else {
        $('scoreSep').textContent = ':';
      }
    }

    trackRounds(ct.score, t.score, state.map);
    renderRibbon();

    var players = state.players || [];

    // "Morte grudenta": uma vez que o jogador morre, o card/ponto continua
    // marcado como morto até o round realmente virar - mesmo que o campo
    // de vida oscile ou demore a atualizar entre um poll e outro.
    // O X de morte fica até o round SEGUINTE começar (não some no fim do
    // round, quando o número do round já vira). Reset em qualquer um destes:
    //  1) trocou de mapa
    //  2) número do round diminuiu (mp_restartgame / partida nova)
    //  3) entrou em "freezetime" (começo de round novo)
    //  4) foi de "over" direto pra "live" (servidor sem freezetime)
    var phase = (state.roundPhase || '').toLowerCase();
    var mapKey = state.map || '';
    var enteredFreezetime = phase === 'freezetime' && lastRoundPhase !== 'freezetime';
    var overToLive = phase === 'live' && lastRoundPhase === 'over';
    var roundWentBack = lastDeathRound !== null && state.round < lastDeathRound;
    // sem mapa nenhum ainda (pacote parcial logo após abrir): não decide nada
    if(mapKey && (mapKey !== lastDeathResetKey || roundWentBack || enteredFreezetime || overToLive)){
      deadThisRound = {};
      deathPos = {};
      lastAlivePos = {};
      lastDeathResetKey = mapKey;
      clearUtility();
      // primeira vez com mapa desde que a página abriu (ou F5): recupera
      // as mortes salvas deste round
